<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fiery Fox – превью макетов</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <iframe id="view" title="Превью выбранного макета"></iframe>

  <div class="dock">
    <div class="slot">
      <button type="button" class="chip" id="variantBtn" aria-expanded="false" aria-controls="variantPop">Classic</button>
      <div class="pop" id="variantPop" hidden>
        <div class="variants" id="variants"></div>
      </div>
    </div>
    <div class="slot">
      <button type="button" class="swatch" id="openColors" aria-expanded="false" aria-controls="colorPop" title="Цвета">
        <i data-key="bg"></i><i data-key="text"></i><i data-key="accent"></i>
      </button>
      <div class="pop pop-color" id="colorPop" hidden>
        <div class="token-tabs" id="tokenTabs"></div>
        <div class="map" id="map"><i></i></div>
        <input class="hue" id="hue" type="range" min="0" max="360" step="1">
        <div class="row">
          <input class="eyedrop" id="drop" type="color">
          <input class="hex" id="hex" type="text" maxlength="7" spellcheck="false">
        </div>
      </div>
    </div>
  </div>

  <script src="preview.js"></script>
</body>
</html>
